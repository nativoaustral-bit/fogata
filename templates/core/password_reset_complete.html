{% extends 'base.html' %}

{% block title %}Contraseña Restablecida — Fogata{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; margin: 48px auto; text-align: center;">
  <div style="font-size: 2.8rem; margin-bottom: 12px;">✅</div>
  <h1 style="font-size: 1.8rem; font-weight: 800; color: #ffffff; margin-bottom: 12px;">
    Contraseña actualizada con éxito
  </h1>

  <div class="card" style="padding: 24px; background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 24px;">
    <p style="font-size: 1rem; color: #f5f5f5; line-height: 1.6; margin: 0;">
      Tu nueva contraseña ha sido establecida. Ya puedes iniciar sesión en Fogata.
    </p>
  </div>

  <a href="{% url 'core:login' %}" class="btn btn-primary">
    Iniciar sesión
  </a>
</div>
{% endblock %}
